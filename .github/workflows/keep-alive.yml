name: Supabase Keep Alive

on:
  schedule:
    # Menjalankan otomatis setiap 3 hari sekali pada jam 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di tab Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send request to Supabase
        uses: fjogeleit/http-request-action@v1
        with:
          url: '${{ secrets.SUPABASE_URL }}/rest/v1/'
          method: 'GET'
          customHeaders: '{"apikey": "${{ secrets.SUPABASE_ANON_KEY }}"}'
